<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Lyrics Studio</title><link rel="stylesheet" href="studio.css"></head><body>
<header><div class="brand"><span class="logo">♫</span> AI Lyrics <em>Studio</em></div><span class="project-name">晚风练习曲</span><div class="tools"><span class="badge">界面原型 · 未接入引擎</span><button id="theme">☾ 夜间</button><button data-info="MV 工作台将在音频流程接入后实现。">▤ MV 工作台</button><button id="timeline">▦ 歌词时间轴</button><button data-info="尚未生成真实音频，暂不能导出。">↓ 导出</button><button data-info="模型与音频设置尚未接入。">☷ 设置</button></div></header>
<aside><div class="library-title">♬ 我的工程 <span id="projectCount">1</span></div><button class="primary create" id="create">＋ 创建工程</button><div id="projects"></div><div class="sidebar-note">参照 SoulX Studio 操作布局<br>示例素材 · 无真实音频</div></aside>
<main><div class="song-head"><div><small>整首歌词</small><h1 id="songName">晚风练习曲</h1></div><div class="counts" id="counts"></div><button data-info="真实版本将在此重新分析音频与歌词。">⟳ 重新提取整首</button></div><section id="lyricsList" aria-label="整首歌词"></section></main>
<footer><div class="play-block"><button class="play primary" data-info="这是界面原型，尚未加载音频。" aria-label="播放整首">▶</button><span id="clock">00:00 / 00:30</span></div><div class="tracks"><div class="track"><button class="mute" aria-label="静音人声">◖))</button><div class="track-label">人声<small id="voiceLabel">改词干声</small></div><div class="wave peach" data-wave="1"></div></div><div class="track"><button class="mute" aria-label="静音伴奏">◖))</button><div class="track-label">伴奏<small>示意伴奏</small></div><div class="wave green" data-wave="2"></div></div><input id="seek" type="range" min="0" max="30" step="0.1" value="0" aria-label="整首播放位置"></div><div class="render-actions"><div class="segmented" id="versions"><button data-version="原唱">原唱</button><button class="chosen" data-version="改词">改词</button><button data-info="尚未接入音色转换。">SVC</button></div><button data-info="音色转换尚未接入。">◉ 音色转换</button><button class="primary" id="batch">生成 0 句</button></div></footer>
<dialog id="edit"><div class="modal-head"><div><small id="editMeta"></small><div class="edit-title"><h2>修改歌词并确认边界</h2><span class="muted tiny">唱句生成方式</span><div class="segmented" id="modes"><button class="chosen" data-mode="melody">≋ 旋律</button><button data-mode="score">♫ MIDI</button></div><label class="check"><input type="checkbox" id="restore">使用原句还原音色</label></div><p class="muted tiny">调整当前句边界，修改歌词后确认保存。波形与槽位均为演示。</p></div><button id="closeEdit" aria-label="关闭改词弹窗">×</button></div><div class="modal-body"><div class="section-label">当前句精准边界 <span>示意波形 · 未进行音频对齐</span></div><div class="boundary"><div class="boundary-head"><div><small>原人声 · 边界编辑</small><p id="sourceText"></p></div><div><label>起点 <input id="start" type="number" min="0" max="30" step="0.001"></label><label>终点 <input id="end" type="number" min="0" max="30" step="0.001"></label><button class="primary" data-info="尚未接入当前句音频试听。">▶ 试听当前句</button></div></div><div class="big-wave wave peach" data-wave="3"></div><div class="boundary-ranges"><label>起点 <input id="startRange" type="range" min="0" max="30" step="0.001"></label><label>终点 <input id="endRange" type="range" min="0" max="30" step="0.001"></label></div><div class="overview wave green" data-wave="4"></div></div><div class="text-edit"><div><div class="section-label">原唱实际唱词</div><p id="original"></p><small class="muted">示例槽位按原词字数展示</small></div><div><label class="section-label" for="newLyrics">新歌词 <span>支持保留 &lt;SP&gt; 停顿标记</span></label><textarea id="newLyrics" rows="2"></textarea></div><strong id="slotCount"></strong></div><div class="section-label">新歌词槽位分配 <span>示例按字展示，真实分配需结合发音与音符</span></div><div id="slots"></div><p class="tiny" id="slotHint"></p></div><div class="modal-footer"><span id="validation" role="status"></span><div><button id="regenerate">⟳ 演示生成</button><button class="primary" id="save">✓ 确认并保存</button></div></div></dialog>
<dialog id="newProject"><h2>创建工程</h2><label>工程名称<input id="newName" placeholder="输入工程名称"></label><p class="muted">当前仅创建界面示例，音频导入将在后续接入。</p><div class="dialog-actions"><button id="cancelCreate">取消</button><button class="primary" id="confirmCreate">创建</button></div></dialog><div id="toast" role="status" aria-live="polite"></div><script src="studio.js"></script></body></html>
