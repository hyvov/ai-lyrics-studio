<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Lyrics Studio · 设计原型</title>
<style>
:root{color-scheme:dark;--bg:#171919;--panel:#202323;--line:#363a39;--muted:#a4aba6;--text:#eeeee8;--accent:#ff9879}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px 'Microsoft YaHei',sans-serif}button,textarea,input{font:inherit}button{cursor:pointer;background:#303535;border:1px solid #49504d;color:var(--text);border-radius:6px;padding:10px 15px}button:hover{border-color:var(--accent)}button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:#241c19;border-color:var(--accent);font-weight:bold}header{height:80px;padding:0 32px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:18px;letter-spacing:1px}.small,.muted{color:var(--muted)}.small{font-size:12px}header .small{margin-top:7px}.demo{color:var(--accent);border:1px solid #765348;padding:5px 9px;border-radius:4px;font-size:12px}.layout{display:grid;grid-template-columns:190px minmax(420px,1fr) 290px;min-height:calc(100vh - 225px)}nav{padding:28px 20px;border-right:1px solid var(--line)}nav strong{display:block;padding:13px 12px;color:var(--accent);background:#332a26;border-radius:5px}nav p{padding:0 12px;line-height:1.9;color:var(--muted)}main{padding:32px 30px}h1{font-size:26px;margin:0 0 9px;font-weight:500}h2{font-size:16px;margin:0 0 20px}.intro{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.columns{display:grid;grid-template-columns:90px 1fr 1fr;gap:20px;padding:0 18px 12px;color:var(--muted);font-size:12px}.row{display:grid;grid-template-columns:90px 1fr 1fr;gap:20px;padding:23px 18px;border-top:1px solid var(--line);cursor:pointer;line-height:1.7}.row.active{background:#2a2c28;border-left:3px solid var(--accent);padding-left:15px}.time{font:12px Consolas,monospace;color:var(--muted)}.time span{display:block;margin-top:10px;font:11px 'Microsoft YaHei',sans-serif}.original{color:#c2c8c1}.target{font-size:16px}.status{font-size:11px;color:var(--accent);margin-top:8px}aside{border-left:1px solid var(--line);padding:32px 23px;background:#1d2020}label{display:block;margin:23px 0 10px;color:var(--muted);font-size:12px}textarea{width:100%;resize:vertical;min-height:110px;background:#141717;border:1px solid #545d55;border-radius:5px;color:var(--text);padding:12px;line-height:1.9}aside .primary{width:100%;margin-top:23px}aside p{font-size:12px;line-height:1.9;color:var(--muted)}.controls{display:flex;gap:8px;margin-top:20px}.controls button{font-size:12px;padding:8px}.notice{min-height:40px;font-size:12px;color:var(--accent);line-height:1.8;margin-top:20px}footer{border-top:1px solid var(--line);padding:18px 32px;background:#1e2221}.transport{display:flex;align-items:center;gap:22px}.transport input{flex:1;accent-color:var(--accent)}.track{margin:18px 0 0;display:flex;gap:5px;height:32px}.track span{flex:1;background:#44584b;border-radius:3px;padding:8px 12px;font-size:11px}.track span.selected{background:#aa6f54;color:#fff}footer .small{margin-top:12px}@media(max-width:1100px){.layout{grid-template-columns:minmax(400px,1fr) 270px}nav{display:none}main{padding:25px 18px}}@media(max-width:760px){.layout{display:block}aside{border-top:1px solid var(--line)}header{padding:0 18px}.columns,.row{grid-template-columns:65px 1fr 1fr;gap:10px}.intro{align-items:flex-start;gap:15px}.transport{gap:12px}footer{padding:18px}.brand{font-size:14px}}
</style>
<header><div><div class="brand">AI LYRICS STUDIO <span class="demo">交互原型</span></div><div class="small">本地创作工作台 / 示例项目</div></div><button id="export">导出音频 ↗</button></header>
<div class="layout"><nav><div class="small" style="padding:0 12px 18px">创作</div><strong>歌词工作台</strong><p>素材与分轨</p><p>生成历史</p><p>项目设置</p><p style="margin-top:90px;font-size:12px">先改一句，<br>听见新的表达。</p></nav><main><div class="intro"><div><h1>把这一句，唱成你的话</h1><div class="muted">未命名练习曲 · 示例歌词 · 00:24</div></div><span class="demo">设计演示 · 无真实音频</span></div><div class="columns"><span>时间 / 片段</span><span>原歌词</span><span>修改后的歌词</span></div><div id="rows"></div><p class="small" style="margin-top:25px">点击句子编辑。原词与新词并排比较，生成只作用于选中句。</p></main><aside><h2 id="heading">当前句</h2><div class="small" id="bounds"></div><label for="lyrics">新歌词</label><textarea id="lyrics"></textarea><div id="fit" class="small" style="margin-top:10px"></div><p>相同字数不代表节奏一定匹配。真实版本会结合发音、音符和持续时间检查。</p><button class="primary" id="generate">生成这一句 · 演示</button><div class="controls"><button id="undo">撤销当前句编辑</button><button id="compare">对比说明</button></div><div class="notice" id="notice" role="status" aria-live="polite">这是界面原型，尚未接入模型。</div></aside></div>
<footer><div class="transport"><button id="play" aria-label="播放说明">▶ 试听</button><span id="clock" class="time">00:00 / 00:24</span><input id="seek" aria-label="时间轴位置" type="range" min="0" max="24" value="0"><span class="small">主时间轴</span></div><div class="track" id="track"></div><div class="small">示意时间片段 · 没有加载音频或真实波形</div></footer>
<script>
const lines=[{a:0,b:6,original:'晚风轻轻经过窗前',text:'晚风轻轻经过窗前',state:'原词'},{a:6,b:12,original:'灯火照亮远方街巷',text:'星光照亮心中远方',state:'待生成'},{a:12,b:18,original:'我们沿着河岸向前',text:'我们沿着河岸向前',state:'原词'},{a:18,b:24,original:'把故事写进了明天',text:'把故事写进了明天',state:'原词'}];let selected=1,history=lines.map(x=>x.text);const $=id=>document.getElementById(id),time=n=>'00:'+String(n).padStart(2,'0');function notice(t){$('notice').textContent=t}function render(){const root=$('rows');root.replaceChildren();$('track').replaceChildren();lines.forEach((x,i)=>{const row=document.createElement('div');row.className='row'+(i===selected?' active':'');row.tabIndex=0;row.setAttribute('role','button');row.setAttribute('aria-label','编辑第'+(i+1)+'句');const timing=document.createElement('div');timing.className='time';timing.textContent=time(x.a);const num=document.createElement('span');num.textContent='第 '+String(i+1).padStart(2,'0')+' 句';timing.append(num);const original=document.createElement('div');original.className='original';original.textContent=x.original;const target=document.createElement('div');target.className='target';target.textContent=x.text;const status=document.createElement('div');status.className='status';status.textContent=x.state;target.append(status);row.append(timing,original,target);row.onclick=()=>select(i);row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(i)}};root.append(row);const clip=document.createElement('span');clip.className=i===selected?'selected':'';clip.textContent='0'+(i+1);$('track').append(clip)});updateFit()}function updateFit(){const x=lines[selected],diff=Array.from(x.text).length-Array.from(x.original).length;$('fit').textContent='原词 '+Array.from(x.original).length+' 字 · 新词 '+Array.from(x.text).length+' 字 · '+(diff===0?'字数一致':diff>0?'增加 '+diff+' 字':'减少 '+(-diff)+' 字')}function select(i){selected=i;$('lyrics').value=lines[i].text;$('heading').textContent='第 '+String(i+1).padStart(2,'0')+' 句';$('bounds').textContent=time(lines[i].a)+' — '+time(lines[i].b);render()}$('lyrics').oninput=()=>{const x=lines[selected];history[selected]=x.text;x.text=$('lyrics').value;x.state=x.text===x.original?'原词':'待生成';render();notice('当前编辑仅保留在本页，刷新后恢复示例。')};$('generate').onclick=()=>{if(!lines[selected].text.trim()){notice('请先输入歌词。');return}lines[selected].state='演示已完成';render();notice('演示状态已更新；没有调用模型或生成音频。')};$('undo').onclick=()=>{const x=lines[selected],current=x.text;x.text=history[selected];history[selected]=current;x.state=x.text===x.original?'原词':'待生成';select(selected);notice('已撤销最近一次当前句文本编辑。')};$('compare').onclick=()=>notice('真实版本将在同一时间位置切换原唱与新唱，便于比较吐字和节奏。');$('export').onclick=()=>notice('导出尚未接入。真实版本会检查修改句的生成状态，再导出混音、干声或歌词。');$('play').onclick=()=>notice('此原型没有音频。真实版本支持循环试听当前句，以及原唱 / 新唱切换。');$('seek').oninput=e=>{$('clock').textContent=time(+e.target.value)+' / 00:24'};select(selected);
</script></html>
